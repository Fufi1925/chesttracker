name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test apps/windows-client/ChestTracker.Tests/ChestTracker.Tests.csproj -c Release
      - shell: pwsh
        run: ./scripts/fetch-ocr-models.ps1
      - run: dotnet test apps/windows-client/Windows.Tests/ChestTracker.Windows.Tests.csproj -c Release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Windows-UI-preview
          path: artifacts/ui-preview/*.png
          if-no-files-found: ignore
      - shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ChestTracker-win-x64
          path: artifacts/ChestTracker-win-x64.zip
          retention-days: 30
